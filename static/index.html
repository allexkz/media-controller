<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/static/manifest.json">
<title>Controle</title>
<style>
  :root {
    --bg: #0e0f13; --card: #181a21; --line: #262934; --text: #eceef3; --muted: #8a8f9e;
    --accent: #7c5cff; --accent-2: #a48bff; --danger: #ff5c7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 520px; margin-inline: auto; user-select: none;
  }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }

  .sessions { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px; scrollbar-width: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px;
  }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; }
  .chip .dot.on { opacity: 1; background: #3ee08f; }

  .now .app { color: var(--accent-2); font-size: 13px; font-weight: 600; }
  .now .title { font-size: 18px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 1.4em; }
  .now .artist { color: var(--muted); font-size: 14px; }
  .progress { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }

  .controls { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 12px; margin-top: 18px; align-items: center; }
  .btn {
    border: 0; border-radius: 18px; background: #222531; color: var(--text); font: inherit;
    height: 72px; display: grid; place-items: center; font-size: 15px; font-weight: 600; transition: transform .08s, background .15s;
  }
  .btn:active { transform: scale(.94); background: #2c3040; }
  .btn.play { height: 88px; background: var(--accent); border-radius: 24px; }
  .btn.play:active { background: var(--accent-2); }
  .btn svg { width: 30px; height: 30px; fill: currentColor; }
  .btn.play svg { width: 38px; height: 38px; }
  .btn small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: -4px; }

  .vol { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .vol + .vol { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
  .vol .label { width: 92px; flex: none; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vol .val { width: 34px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .mute { border: 0; background: transparent; color: var(--text); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .mute svg { width: 22px; height: 22px; fill: currentColor; }
  .mute.on { color: var(--danger); }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 32px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--line) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; margin-top: -9px; box-shadow: 0 1px 4px #0006; }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; }
  .muted-row input { opacity: .4; }

  details summary { color: var(--muted); font-size: 13px; margin: 14px 4px 0; cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  .status { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--danger); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; }
</style>
</head>
<body>

<h2>Tocando agora</h2>
<div class="sessions" id="sessions"></div>
<div class="card now">
  <div class="app" id="app">—</div>
  <div class="title" id="title">Nenhuma mídia detectada</div>
  <div class="artist" id="artist"></div>
  <div class="progress" id="progress" hidden><span id="pos">0:00</span><div class="bar"><i id="barfill"></i></div><span id="dur">0:00</span></div>
  <div class="controls">
    <button class="btn" data-seek="-10"><div><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg><small>10s</small></div></button>
    <button class="btn play" id="toggle"><svg id="toggleIcon" viewBox="0 0 24 24"></svg></button>
    <button class="btn" data-seek="10"><div><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg><small>10s</small></div></button>
  </div>
</div>

<h2>Volume</h2>
<div class="card" id="volumes">
  <div class="vol" id="masterRow">
    <span class="label">Sistema</span>
    <button class="mute" id="masterMute"></button>
    <input type="range" min="0" max="100" id="masterVol">
    <span class="val" id="masterVal">–</span>
  </div>
  <div id="pinnedApps"></div>
  <details id="otherWrap" hidden>
    <summary>Outros apps</summary>
    <div id="otherApps"></div>
  </details>
</div>

<div class="status" id="status" hidden>Sem conexão com o PC</div>

<script>
const ICON = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
  vol: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1A9 9 0 0014 3.2z"/>',
  muted: '<path d="M16.5 12A4.5 4.5 0 0014 8v2.2l2.4 2.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0021 12a9 9 0 00-7-8.8v2.1A7 7 0 0119 12zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2a9 9 0 003.7-1.8l2 2 1.3-1.3-9-9L4.3 3zM12 4L9.9 6.1 12 8.2V4z"/>',
};
const PINNED = ['stremio'];
const $ = id => document.getElementById(id);

// token: vem da URL (?t=) na primeira vez e fica salvo
const params = new URLSearchParams(location.search);
let token = params.get('t');
try { if (token) localStorage.setItem('mc-token', token); else token = localStorage.getItem('mc-token'); } catch {}
if (params.has('t')) history.replaceState(null, '', '/');

let selected = null;      // sessão escolhida manualmente
let state = null;
let dragging = new Set(); // sliders sendo arrastados não recebem update do polling

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'X-Token': token || '', 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

const fmt = s => {
  if (s == null || !isFinite(s)) return '';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
};

function currentSession() {
  if (!state) return null;
  const id = state.sessions.some(s => s.id === selected) ? selected : state.default_session;
  return state.sessions.find(s => s.id === id) || null;
}

function renderMedia() {
  const s = currentSession();
  const chips = $('sessions');
  chips.innerHTML = '';
  for (const x of state.sessions) {
    const b = document.createElement('button');
    b.className = 'chip' + (s && x.id === s.id ? ' sel' : '');
    b.innerHTML = `<span class="dot ${x.playing ? 'on' : ''}"></span>${x.app}`;
    b.onclick = () => { selected = x.id; renderMedia(); };
    chips.appendChild(b);
  }
  chips.hidden = state.sessions.length < 2;

  $('app').textContent = s ? s.app : '—';
  $('title').textContent = s ? (s.title || (s.playing ? 'Reproduzindo' : 'Pausado')) : 'Nenhuma mídia detectada';
  $('artist').textContent = s ? s.artist : '';
  $('toggleIcon').innerHTML = s && s.playing ? ICON.pause : ICON.play;
  const hasTime = s && s.duration > 0;
  $('progress').hidden = !hasTime;
  if (hasTime) {
    $('pos').textContent = fmt(s.position);
    $('dur').textContent = fmt(s.duration);
    $('barfill').style.width = Math.min(100, s.position / s.duration * 100) + '%';
  }
}

function setRange(input, v) { input.value = v; input.style.setProperty('--p', v + '%'); }

function volRow(app) {
  const row = document.createElement('div');
  row.className = 'vol';
  row.innerHTML = `<span class="label"></span><button class="mute"></button><input type="range" min="0" max="100"><span class="val"></span>`;
  row.querySelector('.label').textContent = app.name.replace(/\.exe$/i, '').replace(/-shell-ng$/, '');
  wireVolume(row, `/api/app/${encodeURIComponent(app.name)}`, app.name);
  updateRow(row, app, app.name);
  return row;
}

function updateRow(row, v, key) {
  const input = row.querySelector('input'), mute = row.querySelector('.mute');
  if (!dragging.has(key)) setRange(input, v.volume);
  row.querySelector('.val').textContent = (dragging.has(key) ? input.value : v.volume);
  mute.innerHTML = `<svg viewBox="0 0 24 24">${v.mute ? ICON.muted : ICON.vol}</svg>`;
  mute.classList.toggle('on', v.mute);
  mute.dataset.mute = v.mute ? '1' : '';
  row.classList.toggle('muted-row', v.mute);
}

function wireVolume(row, path, key) {
  const input = row.querySelector('input'), mute = row.querySelector('.mute'), val = row.querySelector('.val');
  let timer = null;
  const send = () => api(path, { volume: +input.value }).catch(() => {});
  input.addEventListener('input', () => {
    dragging.add(key);
    input.style.setProperty('--p', input.value + '%');
    val.textContent = input.value;
    if (!timer) timer = setTimeout(() => { timer = null; send(); }, 60);
  });
  input.addEventListener('change', () => { send(); setTimeout(() => dragging.delete(key), 400); });
  mute.addEventListener('click', async () => {
    await api(path, { mute: !mute.dataset.mute }).catch(() => {});
    refresh();
  });
}

const appRows = new Map();
function renderVolumes() {
  updateRow($('masterRow'), state.master, '__master');
  const pinned = $('pinnedApps'), other = $('otherApps');
  const seen = new Set();
  for (const app of state.apps) {
    seen.add(app.name);
    let row = appRows.get(app.name);
    if (!row) { row = volRow(app); appRows.set(app.name, row); }
    else updateRow(row, app, app.name);
    const isPinned = PINNED.some(p => app.name.toLowerCase().startsWith(p));
    const parent = isPinned ? pinned : other;
    if (row.parentNode !== parent) parent.appendChild(row);
  }
  for (const [name, row] of appRows) if (!seen.has(name)) { row.remove(); appRows.delete(name); }
  $('otherWrap').hidden = !other.children.length;
}

async function refresh() {
  try {
    state = await api('/api/state');
    $('status').hidden = true;
    renderMedia();
    renderVolumes();
  } catch (e) {
    $('status').textContent = e.message === '401' ? 'Token inválido — abra o link do QR code' : 'Sem conexão com o PC';
    $('status').hidden = false;
  }
}

wireVolume($('masterRow'), '/api/master', '__master');

$('toggle').onclick = async () => {
  const s = currentSession();
  if (s) { s.playing = !s.playing; renderMedia(); }
  await api('/api/media/toggle', { session: s?.id }).catch(() => {});
  setTimeout(refresh, 400);
};
document.querySelectorAll('[data-seek]').forEach(b => b.onclick = async () => {
  if (navigator.vibrate) navigator.vibrate(15);
  await api('/api/seek', { seconds: +b.dataset.seek, session: currentSession()?.id }).catch(() => {});
  setTimeout(refresh, 300);
});

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
